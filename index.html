<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Sites Management Tool</title>

    <style>
        :root {
            --bg-color: rgba(0, 0, 0, 0.55);
            --text-color: #eee;
            --link-color: #ffd966;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            position: relative;
            color: var(--text-color);
        }

        .menu-row {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            position: relative;
        }

        .menu-box {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 14px;
            background: var(--bg-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            flex: 1;
        }

        .menu-box h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
        }

        input,
        select {
            height: 32px;
            padding: 4px 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .search-row {
            margin-top: 10px;
            display: flex;
            gap: 6px;
        }

        .search-row input {
            flex: 1;
        }

        .fav-bar {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 16px;
            background: var(--bg-color);
        }

        .fav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            margin: 4px;
            border-radius: 20px;
            background: #ffe9a8;
            border: 1px solid #e0c36a;
            cursor: grab;
            font-size: 14px;
        }

        body[style*="--bg-color: rgba(0, 0, 0, 0.55)"] .fav-item {
            background: #333;
            border-color: #555;
        }

        .fav-item a {
            text-decoration: none;
            color: #333 !important;
            font-weight: bold;
        }

        body[style*="--bg-color: rgba(0, 0, 0, 0.55)"] .fav-item a {
            color: #ffd966 !important;
        }

        .fav-item a:hover {
            text-decoration: underline;
        }

        .main {
            display: flex;
            gap: 18px;
            position: relative;
        }

        .group-panel {
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background: var(--bg-color);
        }

        .group-item {
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            border: 1px solid transparent;
        }

        .group-item:hover {
            background: rgba(224, 223, 221, 0.35);
            color: #ffd966;
        }

        .group-item.active {
            background: rgba(224, 223, 221, 0.35);
            border-color: #ffd966;
            color: #ffd966;
            font-weight: bold;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .site-panel {
            flex: 1;
        }

        .site {
            padding: 8px;
            border: 1px solid #aaa;
            margin: 6px 0;
            background: var(--bg-color);
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site.drag-over {
            border: 2px dashed #000;
            background: #eef3ff;
        }

        .site a {
            color: var(--link-color);
            text-decoration: none;
        }

        .site a:hover {
            text-decoration: underline;
        }

        .site-url {
            color: #666;
            font-size: 13px;
            max-width: 420px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .group-title-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        button {
            margin-left: 4px;
            cursor: pointer;
        }

        #currentGroupTitle {
            color: #000000;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }
    </style>
</head>

<body>

    <div class="menu-row">
        <div class="menu-box">
            <h3>💾 사이트 백업 / 검색</h3>
            <button onclick="backupData()">백업</button>
            <button onclick="restoreClick()">복원</button>
            <button onclick="bgFile.click()">배경</button>
            <button onclick="resetBg()" style="color:red;">배경삭제</button>
            <button onclick="toggleTheme()">🌗 다크/라이트 토글</button>
            <input type="file" id="restoreFile" hidden accept=".json">
            <input type="file" id="bgFile" hidden accept="image/*">

            <div class="search-row">
                <input id="searchInput" placeholder="검색어 입력" onkeydown="if(event.key==='Enter') searchGoogle()">
                <button onclick="searchGoogle()">구글</button>
                <button onclick="searchNaver()">네이버</button>
            </div>
        </div>

        <div class="menu-box">
            <h3>📁 그룹 생성</h3>
            <input id="newGroupInput">
            <button onclick="addGroup()">생성</button>
        </div>

        <div class="menu-box">
            <h3>➕ 사이트 / 폴더 추가</h3>
            <input id="nameInput" placeholder="이름"><br>
            <input id="urlInput" placeholder="URL 또는 폴더" style="margin-top:4px;"><br>
            <select id="groupSelect" style="margin-top:4px;"></select>
            <button onclick="addSite()">추가</button>
        </div>
    </div>

    <div class="fav-bar">
        <b>⭐ 즐겨찾기</b>
        <div id="favBar"></div>
    </div>

    <div class="main">
        <div class="group-panel" id="groupPanel"></div>
        <div class="site-panel">
            <div class="group-title-bar">
                <h3 id="currentGroupTitle"></h3>
                <button onclick="renameGroup()">이름수정</button>
                <button onclick="deleteGroup()">삭제</button>
            </div>
            <div id="siteList"></div>
        </div>
    </div>

    <script>
        // --- IndexedDB 로직 추가 ---
        const DB_NAME = "SiteManagerDB";
        const STORE_NAME = "Assets";
        let db;

        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore(STORE_NAME);
        };
        request.onsuccess = e => {
            db = e.target.result;
            loadData(); // DB 연결 후 데이터 로드
        };

        function saveBgToDB(base64) {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(base64, "backgroundImage");
        }

        function loadBgFromDB(callback) {
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get("backgroundImage");
            req.onsuccess = () => callback(req.result);
        }

        function deleteBgFromDB() {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).delete("backgroundImage");
        }
        // -------------------------

        let groups = [];
        let sites = [];
        let favorites = [];
        let selectedGroup = null;
        let editIndex = null;
        let dragSiteIndex = null;
        let dragGroupIndex = null;
        let dragFavIndex = null;
        let darkMode = true;

        const favBar = document.getElementById('favBar');
        const groupPanel = document.getElementById('groupPanel');
        const siteList = document.getElementById('siteList');
        const currentGroupTitle = document.getElementById('currentGroupTitle');
        const groupSelect = document.getElementById('groupSelect');
        const searchInput = document.getElementById('searchInput');
        const newGroupInput = document.getElementById('newGroupInput');
        const nameInput = document.getElementById('nameInput');
        const urlInput = document.getElementById('urlInput');
        const restoreFile = document.getElementById('restoreFile');
        const bgFile = document.getElementById('bgFile');

        // 이름 입력 시 URL 자동완성을 위한 매칭표
        // 키워드를 추가/수정하면 자동완성 대상이 변경됩니다.
        // 별칭은 "키워드1|키워드2" 형태로 작성하면 둘 중 하나만 입력해도 매칭됩니다.
        const NAME_URL_MAP = {

            "youtube|유튜브": "https://www.youtube.com/",
            chatgpt: "https://chatgpt.com/",
            "gemini|제미나이": "https://gemini.google.com/app",
            claude: "https://claude.ai",

            // GM Portal / AI
            "gmone|socrates": "https://gmone.gm.com/",
            "it": "https://gm.service-now.com/esc",
            peoplefinder: "https://peoplefinder.gm.com",
            "recognition|gm recognition": "https://gm.achievers.com/home",
            "smart search": "https://smartsearch.gm.com/",
            "glean|gm glean": "https://gm.glean.com",
            "copilot chat": "https://m365.cloud.microsoft/chat/",
            "copilot studio": "https://copilotstudio.microsoft.com/",
            "github gm": "https://github.com/enterprises/generalmotors",
            "gm github repository link": "https://github.com/enterprises/generalmotors",
            "github enterprise 계정신청": "https://gm.service-now.com/esc?id=sc_cat_item&sys_id=aa470c6e6c52ced451b162ed93ef621d&table=sc_cat_item&searchTerm=github",
            "github copilot 신청": "https://gm.service-now.com/esc?id=sc_cat_item&sys_id=ad2a41b394b6c6504c4e7813fa9bed38&table=sc_cat_item&searchTerm=github",
            "copilot studio 라이센스 신청": "https://generalmotors.sharepoint.com/sites/pphub/Lists/Copilot%20Studio%20License%20Request/AllItems.aspx",

            // GM Design / Quality
            "emerge|ecr": "https://emerge.gm.com/",
            gmlogic: "https://gmlogic.gm.com/",
            "apm": "https://apmclone.gm.com/apm/",
            teamcenter: "https://generalmotors.sharepoint.com/sites/TcAE/Pages/default.aspx",
            gdm: "https://documents.gm.com/globaldocs/browse?id=2200001306230000001",
            "esci|icd": "https://esci.cld.gm.com/ui/",
            "service information": "https://sporef.xw.gm.com/weblogic/sporef/verifyGPLDaccess?appParm=si",
            "p2p aspera": "https://p2pfd.gm.com/",

            etracktool: "https://etracktool.gm.com/ett",
            spes: "https://spes.gm.com",
            tvms: "https://dash.gm.com/tvms/",
            "ewo history": "https://app.powerbi.com/groups/f3ef2b12-b8eb-4445-94b9-37f08bf87283/rdlreports/8fb05904-578a-414f-b440-4359a13936d5?ctid=5de110f8-2e0f-4d45-891d-bcf2218e253d&experience=power-bi",
            ptr: "https://generalmotors-my.sharepoint.com/:w:/g/personal/kzyp0c_apa_corp_gm_com/IQBUIyBOETs2RJ0OA5f8wYEQAU28ecgYtd184w1uwYMkrUE?CID=09a09d56-225c-5b77-ba73-559e454155d2",
            sqms: "https://sqms.gm.com",
            gwm: "https://gwmtoolkit.gm.com/gwm_web/sitemap",

            partlink: "https://partlink.gm.com/",

            "gmio wsi|gmio wsi power bi": "https://app.powerbi.com/groups/1c50ea78-e634-4185-be2d-25daa7b8d251/list?experience=power-bi",
            dfss: "https://generalmotors.sharepoint.com/sites/DFSS1/SitePages/DFSS.aspx",

            // GM Collaboration / Learning
            "naeil|내일": "https://generalmotors.sharepoint.com/sites/tckin/SitePages/InnovationPortal.aspx",
            "naeil project": "https://generalmotors.sharepoint.com/sites/tckin/Lists/Activities/AllItems.aspx?as=json&isAscending=false&sortField=MaterialLink&viewid=2bed33ac%2D5904%2D45dc%2D8e4e%2D9031926c1072",
            pectory: "https://generalmotors.sharepoint.com/sites/gmtckpec/SitePages/Home.aspx",
            "직급검색": "https://generalmotors.sharepoint.com/sites/gmtckpec/SitePages/Position.aspx",
            "nx course list": "https://generalmotors.sharepoint.com/sites/plmsystemstraining/Lists/NX%20REF%20Course%20List/AllItems.aspx",
            "plm system video channel": "https://video.gm.com/channel/MATH%2BBASED%2BTRAINING%2BCHANNEL/264175202",
            "gm learning": "https://mylearning.gm.com",
            "방문자|반출|visitor": "https://epass.gm.com/#/",
            "ptr관리대장|ptr ledger": "https://generalmotors-my.sharepoint.com/:w:/g/personal/kzyp0c_apa_corp_gm_com/IQBUIyBOETs2RJ0OA5f8wYEQAU28ecgYtd184w1uwYMkrUE"
        };

        function findMappedUrlByName(name) {
            const keyword = (name || "").trim().toLowerCase();
            if (!keyword) return "";

            const inputTokens = keyword.split(/\s+/).filter(Boolean);

            for (const [rawKey, url] of Object.entries(NAME_URL_MAP)) {
                const aliases = rawKey.toLowerCase().split("|").map(x => x.trim()).filter(Boolean);

                // exact: "emerge" 또는 "ecr" 입력
                if (aliases.includes(keyword)) return url;

                // token: "open emerge now"처럼 단어 중 하나가 alias와 일치
                if (inputTokens.some(t => aliases.includes(t))) return url;

                // include: alias가 입력 문자열 일부로 포함된 경우
                if (aliases.some(a => keyword.includes(a))) return url;
            }

            return "";
        }

        nameInput.addEventListener("input", () => {
            const mappedUrl = findMappedUrlByName(nameInput.value);
            if (mappedUrl) urlInput.value = mappedUrl;
        });

        function getSearchText() { return encodeURIComponent(searchInput.value.trim()); }
        function searchGoogle() { const q = getSearchText(); if (!q) return; window.open("https://www.google.com/search?q=" + q, "_blank"); }
        function searchNaver() { const q = getSearchText(); if (!q) return; window.open("https://search.naver.com/search.naver?query=" + q, "_blank"); }

        bgFile.addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const bgImg = ev.target.result;
                applyBg(bgImg);
                saveBgToDB(bgImg); // IndexedDB에 대용량 저장
            };
            reader.readAsDataURL(file);
        });

        function applyBg(url) { document.body.style.backgroundImage = url ? `url('${url}')` : "none"; }
        function resetBg() { if (confirm("배경 이미지를 삭제할까요?")) { applyBg(""); deleteBgFromDB(); } }

        function normalizeUrl(input) {
            if (!input) return "";
            input = input.trim();
            if (/^(https?:\/\/|file:\/\/)/i.test(input)) return input;
            if (/^[a-zA-Z]:[\\/]/.test(input)) return "file:///" + input.replace(/\\/g, "/");
            if (/^\\\\/.test(input)) return "file:" + input.replace(/\\/g, "/");
            if (input.includes(".")) return "https://" + input;
            return input;
        }
        function getIcon(url) { return url.startsWith("file://") ? "📁" : "🌐"; }

        function saveData() { 
            // 배경이미지는 제외하고 LocalStorage에 저장
            localStorage.setItem("siteData", JSON.stringify({ groups, sites, favorites, darkMode })); 
        }

        function loadData() {
            const d = JSON.parse(localStorage.getItem("siteData"));
            if (d) { 
                groups = d.groups || []; 
                sites = d.sites || []; 
                favorites = d.favorites || []; 
                darkMode = d.darkMode !== false; 
                applyTheme(); 
            }
            // 배경이미지는 IndexedDB에서 비동기로 가져옴
            loadBgFromDB(img => {
                if (img) applyBg(img);
                renderAll();
            });
        }

        async function backupData() { 
            loadBgFromDB(bgImg => {
                const blob = new Blob([JSON.stringify({ groups, sites, favorites, bgImg, darkMode }, null, 2)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "sites_backup.json";
                a.click();
            });
        }

        function restoreClick() { restoreFile.click(); }
        restoreFile.addEventListener("change", e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                const d = JSON.parse(ev.target.result);
                groups = d.groups || []; 
                sites = d.sites || []; 
                favorites = d.favorites || []; 
                darkMode = d.darkMode !== false;
                
                if (d.bgImg) {
                    applyBg(d.bgImg);
                    saveBgToDB(d.bgImg);
                } else {
                    applyBg("");
                    deleteBgFromDB();
                }
                
                applyTheme(); 
                saveData(); 
                renderAll();
            };
            r.readAsText(f);
        });

        function addGroup() { const n = newGroupInput.value.trim(); if (!n || groups.includes(n)) return; groups.push(n); newGroupInput.value = ""; saveData(); renderAll(); }
        function renameGroup() { if (!selectedGroup) return; const n = prompt("새 이름", selectedGroup); if (!n || groups.includes(n)) return; groups = groups.map(g => g === selectedGroup ? n : g); sites.forEach(s => { if (s.group === selectedGroup) s.group = n; }); selectedGroup = n; saveData(); renderAll(); }
        function deleteGroup() { if (!selectedGroup) return; if (!confirm("그룹 삭제?")) return; groups = groups.filter(g => g !== selectedGroup); sites.filter(s => s.group === selectedGroup).forEach(s => { const idx = sites.indexOf(s); favorites = favorites.filter(f => f !== idx); }); sites = sites.filter(s => s.group !== selectedGroup); selectedGroup = groups[0] || null; saveData(); renderAll(); }

        function addSite() { const name = nameInput.value.trim(); let url = urlInput.value.trim(); const group = groupSelect.value; if (!name || !url) return; url = normalizeUrl(url); if (editIndex !== null) { sites[editIndex] = { name, url, group }; editIndex = null; } else { sites.push({ name, url, group }); } nameInput.value = ""; urlInput.value = ""; saveData(); renderSites(); renderFavorites(); }
        function editSite(i) { nameInput.value = sites[i].name; urlInput.value = sites[i].url; groupSelect.value = sites[i].group; editIndex = i; }
        function deleteSite(i) { if (!confirm("삭제?")) return; sites.splice(i, 1); favorites = favorites.filter(x => x !== i).map(x => x > i ? x - 1 : x); saveData(); renderAll(); }

        function toggleFavorite(i) { if (favorites.includes(i)) favorites = favorites.filter(x => x !== i); else favorites.push(i); saveData(); renderFavorites(); renderSites(); }
        function renderFavorites() {
            favBar.innerHTML = "";
            favorites.forEach((idx, pos) => {
                const s = sites[idx]; if (!s) return;
                const d = document.createElement("div"); d.className = "fav-item"; d.draggable = true;
                d.ondragstart = () => dragFavIndex = pos;
                d.ondragover = e => e.preventDefault();
                d.ondrop = e => { if (dragFavIndex === null) return; const mv = favorites.splice(dragFavIndex, 1)[0]; favorites.splice(pos, 0, mv); dragFavIndex = null; saveData(); renderFavorites(); };
                d.innerHTML = `${getIcon(s.url)} <a href="${s.url}" target="_blank">${s.name}</a> <button onclick="toggleFavorite(${idx})">❌</button>`;
                favBar.appendChild(d);
            });
        }

        function renderGroupPanel() {
            groupPanel.innerHTML = "";
            groups.forEach((g, idx) => {
                const div = document.createElement("div");
                div.className = "group-item" + (g === selectedGroup ? " active" : "");
                div.textContent = g;
                div.draggable = true;
                div.onclick = () => { selectedGroup = g; renderAll(); };
                div.ondragover = e => e.preventDefault();
                div.ondrop = e => {
                    if (dragSiteIndex !== null) { sites[dragSiteIndex].group = g; dragSiteIndex = null; saveData(); renderAll(); }
                    if (dragGroupIndex !== null) { const d = groups.splice(dragGroupIndex, 1)[0]; groups.splice(idx, 0, d); dragGroupIndex = null; saveData(); renderAll(); }
                };
                div.ondragstart = () => dragGroupIndex = idx;
                groupPanel.appendChild(div);
            });
        }

        function renderSites() {
            currentGroupTitle.textContent = "📁 " + (selectedGroup || "");
            siteList.innerHTML = "";
            sites.forEach((s, i) => {
                if (s.group !== selectedGroup) return;
                const div = document.createElement("div"); div.className = "site"; div.draggable = true;
                div.ondragstart = () => dragSiteIndex = i;
                div.ondragover = e => { e.preventDefault(); div.classList.add("drag-over"); };
                div.ondragleave = () => div.classList.remove("drag-over");
                div.ondrop = e => {
                    e.stopPropagation();
                    div.classList.remove("drag-over");
                    if (dragSiteIndex === null || dragSiteIndex === i) return;
                    const moved = sites.splice(dragSiteIndex, 1)[0];
                    sites.splice(i, 0, moved);
                    favorites = favorites.map(idx => { if (idx === dragSiteIndex) return i; if (dragSiteIndex < i && idx > dragSiteIndex && idx <= i) return idx - 1; if (dragSiteIndex > i && idx < i && idx >= i) return idx + 1; return idx; });
                    dragSiteIndex = null;
                    saveData();
                    renderSites();
                    renderFavorites();
                };
                const favMark = favorites.includes(i) ? "⭐" : "☆";
                div.innerHTML = `${getIcon(s.url)} <a href="${s.url}" target="_blank">${s.name}</a> <a class="site-url" href="${s.url}" target="_blank">${s.url}</a> <button onclick="toggleFavorite(${i})">${favMark}</button> <button onclick="editSite(${i})">수정</button> <button onclick="deleteSite(${i})">삭제</button>`;
                siteList.appendChild(div);
            });
        }

        function renderGroupOptions() {
            groupSelect.innerHTML = "";
            groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; groupSelect.appendChild(o); });
        }

        function renderAll() { 
            if (groups.length === 0) groups.push("기본");
            if (!selectedGroup) selectedGroup = groups[0]; 
            renderGroupOptions(); 
            renderGroupPanel(); 
            renderSites(); 
            renderFavorites(); 
        }

        function toggleTheme() {
            darkMode = !darkMode;
            applyTheme();
            saveData();
        }
        function applyTheme() {
            if (darkMode) {
                document.documentElement.style.setProperty("--bg-color", "rgba(0,0,0,0.55)");
                document.documentElement.style.setProperty("--text-color", "#eee");
                document.documentElement.style.setProperty("--link-color", "#ffd966");
            } else {
                document.documentElement.style.setProperty("--bg-color", "rgba(245,247,250,0.55)");
                document.documentElement.style.setProperty("--text-color", "#111");
                document.documentElement.style.setProperty("--link-color", "#053bc5");
            }
        }
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault(), false);
        document.addEventListener('selectstart', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
        }, false);

        document.onkeydown = function (e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey) {
                const target = e.target.tagName;
                if ((target === 'INPUT' || target === 'TEXTAREA') && e.keyCode == 65) return true; 
                if (e.keyCode == 'U'.charCodeAt(0) || 
                    e.keyCode == 'S'.charCodeAt(0) || 
                    (e.shiftKey && e.keyCode == 'I'.charCodeAt(0))) {
                    return false;
                }
            }
        };
    </script>

</body>
</html>
